name: Daily Short Production

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [produce]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  STORY_LLM_API_KEY: ${{ secrets.STORY_LLM_API_KEY }}
  STORY_LLM_BASE_URL: ${{ secrets.STORY_LLM_BASE_URL }}
  STORY_LLM_MODEL: ${{ secrets.STORY_LLM_MODEL }}
  TEXT2MOTION_API_KEY: ${{ secrets.TEXT2MOTION_API_KEY }}
  MIXAMO_TOKEN: ${{ secrets.MIXAMO_TOKEN }}
  YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

jobs:
  prepare:
    name: Write story, narrate, plan animation
    runs-on: ubuntu-latest
    outputs:
      story_id: ${{ steps.plan.outputs.story_id }}
      scene_list: ${{ steps.scenes.outputs.scene_list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -r requirements.txt
      - name: Pick rotating story prompt
        id: plan
        run: |
          set -euo pipefail
          mapfile -t PROMPTS < <(find content/prompts -maxdepth 1 -type f -name '*.txt' | sort)
          COUNT=${#PROMPTS[@]}; test "$COUNT" -gt 0
          INDEX=$(( $(date -u +%s) / 43200 % COUNT ))
          STORY="${PROMPTS[$INDEX]}"
          STORY_ID="$(basename "$STORY" .txt)-$(sha256sum "$STORY" | cut -c1-8)-$(date -u +%Y%m%d-%H%M)"
          echo "story_id=${STORY_ID}" >> "$GITHUB_OUTPUT"
          echo "STORY=${STORY}" >> "$GITHUB_ENV"
      - name: Generate story
        run: python scripts/content/generate_story.py --prompt "$STORY" --out staging/story.json
      - name: Generate narration
        run: python scripts/assembly/generate_tts.py --story staging/story.json --out staging/audio
      - name: Build animation manifest
        run: python scripts/animation/build_animation_manifest.py --story staging/story.json --out staging/animation_manifest.json
      - name: Validate animation manifest
        run: python scripts/animation/validate_animation_manifest.py --manifest staging/animation_manifest.json
      - name: Fetch Text2Motion animations
        if: env.TEXT2MOTION_API_KEY != ''
        run: |
          python - <<'PY'
          import json, os, subprocess
          story=json.load(open('staging/story.json'))
          for s in story['scenes']:
              if s.get('animation_source') == 'text2motion':
                  out=f"staging/animations/{story['id']}/scene{s['id']}.fbx"
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  subprocess.run(['python','scripts/animation/text2motion.py','--prompt',s['animation_prompt'],'--out',out],check=True)
          PY
      - name: Report scenes
        id: scenes
        run: |
          python - <<'PY'
          import json,os
          story=json.load(open('staging/story.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('scene_list='+json.dumps([str(s['id']) for s in story['scenes']])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: story-assets, path: staging/, if-no-files-found: error}

  render:
    name: Render scene ${{ matrix.scene }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scene: ${{ fromJson(needs.prepare.outputs.scene_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: story-assets, path: staging}
      - name: Restore assets
        run: |
          set -euo pipefail
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p content/stories assets/animations output/scenes
          cp staging/story.json "content/stories/${STORY_ID}.json"
          if [ -d staging/animations ]; then cp -r staging/animations/* assets/animations/ 2>/dev/null || true; fi
      - name: Install host FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download character model
        run: |
          set -euo pipefail
          mkdir -p assets/characters
          curl -sL --fail -o assets/characters/hero.fbx \
            "https://github.com/sinan-khan/Zack-D.Film-yt/releases/download/hero.fbx/hero.fbx.fbx"
          test -s assets/characters/hero.fbx
      - name: Download Mixamo animation library
        run: |
          set -euo pipefail
          mkdir -p assets/animations/mixamo
          BASE="https://github.com/sinan-khan/Zack-D.Film-yt/releases/download/mixamo-animations"
          for CLIP in climbing stretching looking-around sitting-on-ground walking waving leaning-on-wall talking writing; do
            DEST="assets/animations/mixamo/${CLIP}.fbx"
            if curl -sL --fail -o "$DEST" "${BASE}/${CLIP}.fbx"; then
              :
            elif curl -sL --fail -o "$DEST" "${BASE}/${CLIP}.fbx.fbx"; then
              echo "note: ${CLIP}.fbx was uploaded as ${CLIP}.fbx.fbx - fetched that instead"
            else
              echo "::error::could not find ${CLIP}.fbx or ${CLIP}.fbx.fbx in the mixamo-animations release"
              exit 1
            fi
            test -s "$DEST"
          done
      - name: Render frames with Blender container
        run: |
          set -euo pipefail
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          docker run --rm -v "$PWD:/work" -w /work blendergrid/blender:latest \
            -b --python-exit-code 1 --python scripts/render/render_scene.py -- \
            --story "content/stories/${STORY_ID}.json" --scene ${{ matrix.scene }} \
            --out "output/scenes/scene${{ matrix.scene }}.mp4" --fps 15 --resolution-x 540 --resolution-y 960 \
            --engine BLENDER_EEVEE --samples 8 --max-seconds 90 --no-encode
      - name: Encode scene
        run: |
          set -euo pipefail
          FRAME_DIR="output/scenes/.frames_scene${{ matrix.scene }}"; OUT="output/scenes/scene${{ matrix.scene }}.mp4"
          COUNT="$(find "$FRAME_DIR" -type f -name 'frame*.jpg' | wc -l)"; test "$COUNT" -gt 0
          ffmpeg -y -hide_banner -loglevel error -framerate 15 -i "$FRAME_DIR/frame%04d.jpg" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "$OUT"
          test -s "$OUT"; rm -rf "$FRAME_DIR"
      - uses: actions/upload-artifact@v4
        with: {name: scene-${{ matrix.scene }}, path: output/scenes/scene${{ matrix.scene }}.mp4, if-no-files-found: error}

  assemble:
    name: Assemble final video + thumbnail
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: story-assets, path: staging}
      - uses: actions/download-artifact@v4
        with: {pattern: scene-*, path: rendered, merge-multiple: false}
      - name: Restore working layout
        run: |
          set -euo pipefail
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p content/stories output/scenes output/audio
          cp staging/story.json "content/stories/${STORY_ID}.json"
          cp staging/audio/*.mp3 output/audio/
          find rendered -type f -name '*.mp4' -exec cp {} output/scenes/ \;
      - name: Normalize scenes
        run: |
          set -euo pipefail
          mkdir -p output/scenes/final
          for f in output/scenes/scene*.mp4; do base=$(basename "$f"); ffmpeg -y -hide_banner -loglevel error -i "$f" -vf "scale=1080:1920:flags=lanczos,fps=24,format=yuv420p" -c:v libx264 -preset veryfast -crf 18 -movflags +faststart "output/scenes/final/$base"; done
          rm -f output/scenes/scene*.mp4; cp output/scenes/final/*.mp4 output/scenes/
      - name: Composite
        run: python scripts/assembly/composite.py --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" --audio output/audio --scenes output/scenes --out output/final.mp4
      - name: Thumbnail
        run: python scripts/assembly/thumbnail.py --video output/final.mp4 --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" --out output/thumbnail.jpg
      - name: Final quality gate
        run: |
          set -euo pipefail
          test -s output/final.mp4; test -s output/thumbnail.jpg
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/final.mp4); H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/final.mp4); D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/final.mp4); A=$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 output/final.mp4 || true)
          test "$W" = "1080"; test "$H" = "1920"; test -n "$A"
          python -c "d=float('$D'); assert 40 <= d <= 100, d"
          ffmpeg -v error -i output/final.mp4 -f null -
          sha256sum output/final.mp4 > output/final.mp4.sha256
          echo "Quality gate passed: ${W}x${H}, ${D}s, audio=${A}"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            output/final.mp4
            output/final.mp4.sha256
            output/thumbnail.jpg
            content/stories/${{ needs.prepare.outputs.story_id }}.json
            staging/animation_manifest.json
          if-no-files-found: error

  upload:
    name: Upload to YouTube
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: final, path: .}
      - name: Verify package before upload
        run: |
          set -euo pipefail
          test -s output/final.mp4; test -s output/thumbnail.jpg; test -s output/final.mp4.sha256
          sha256sum -c output/final.mp4.sha256
          ffmpeg -v error -i output/final.mp4 -f null -
      - name: Upload video
        run: python scripts/upload/upload_youtube.py --video output/final.mp4 --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" --thumbnail output/thumbnail.jpg
