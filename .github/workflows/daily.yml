name: Daily Short Production

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [produce]

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORY_LLM_API_KEY: ${{ secrets.STORY_LLM_API_KEY }}
  STORY_LLM_BASE_URL: ${{ secrets.STORY_LLM_BASE_URL }}
  STORY_LLM_MODEL: ${{ secrets.STORY_LLM_MODEL }}
  TEXT2MOTION_API_KEY: ${{ secrets.TEXT2MOTION_API_KEY }}
  MIXAMO_TOKEN: ${{ secrets.MIXAMO_TOKEN }}
  YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

jobs:
  prepare:
    name: Write story, narrate, fetch animations
    runs-on: ubuntu-latest
    outputs:
      story_id: ${{ steps.plan.outputs.story_id }}
      scene_list: ${{ steps.scenes.outputs.scene_list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pick rotating story prompt
        id: plan
        run: |
          mapfile -t PROMPTS < <(find content/prompts -maxdepth 1 -type f -name '*.txt' | sort)
          COUNT=${#PROMPTS[@]}
          test "$COUNT" -gt 0 || { echo "No story prompts found"; exit 1; }
          INDEX=$(( $(date -u +%s) / 43200 % COUNT ))
          STORY="${PROMPTS[$INDEX]}"
          STORY_ID="$(basename "$STORY" .txt)-$(date -u +%Y%m%d-%H%M)"
          echo "story_id=${STORY_ID}" >> "$GITHUB_OUTPUT"
          echo "STORY=${STORY}" >> "$GITHUB_ENV"
          echo "Using prompt: $STORY"
      - name: Generate production plan (LLM or offline fallback)
        run: python scripts/content/generate_story.py --prompt "$STORY" --out staging/story.json
      - name: Generate voice-over narration
        run: python scripts/assembly/generate_tts.py --story staging/story.json --out staging/audio
      - name: Fetch Text2Motion animations
        if: env.TEXT2MOTION_API_KEY != ''
        run: |
          python - <<'EOF'
          import json, os, subprocess
          story = json.load(open("staging/story.json"))
          for s in story["scenes"]:
              if s.get("animation_source") == "text2motion":
                  out = f"staging/animations/{story['id']}/scene{s['id']}.fbx"
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  subprocess.run(["python", "scripts/animation/text2motion.py", "--prompt", s["animation_prompt"], "--out", out], check=True)
          EOF
      - name: Report scene list for the render matrix
        id: scenes
        run: |
          python - <<'EOF'
          import json, os
          story = json.load(open("staging/story.json"))
          ids = [str(s["id"]) for s in story["scenes"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("scene_list=" + json.dumps(ids) + "\n")
          print("scene_list=" + json.dumps(ids))
          EOF
      - name: Upload story assets for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: story-assets
          path: staging/
          if-no-files-found: error

  render:
    name: Render scene ${{ matrix.scene }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJson(needs.prepare.outputs.scene_list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download story assets
        uses: actions/download-artifact@v4
        with:
          name: story-assets
          path: staging
      - name: Restore plan and animation files
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p content/stories assets/animations output/scenes
          cp staging/story.json "content/stories/${STORY_ID}.json"
          if [ -d "staging/animations" ]; then cp -r staging/animations/* assets/animations/; fi
      - name: Check optional character model
        run: |
          if [ -f assets/characters/hero.fbx ]; then
            echo "Using repository character: assets/characters/hero.fbx"
          else
            echo "No repository character FBX found; renderer will use its procedural fallback."
          fi
      - name: Render scene with Blender (containerized)
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          docker run --rm -v "$PWD:/work" -w /work \
            blendergrid/blender:latest \
            -b --python-exit-code 1 --python scripts/render/render_scene.py -- \
            --story "content/stories/${STORY_ID}.json" \
            --scene ${{ matrix.scene }} \
            --out "output/scenes/scene${{ matrix.scene }}.mp4" \
            --fps 24 --resolution-x 1080 --resolution-y 1920 \
            --engine BLENDER_EEVEE_NEXT --samples 32 --max-seconds 90
      - name: Validate rendered scene
        run: |
          test -s "output/scenes/scene${{ matrix.scene }}.mp4"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "output/scenes/scene${{ matrix.scene }}.mp4"
      - name: Upload rendered scene
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: output/scenes/scene${{ matrix.scene }}.mp4
          if-no-files-found: error

  assemble:
    name: Assemble final video + thumbnail
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download story assets
        uses: actions/download-artifact@v4
        with:
          name: story-assets
          path: staging
      - name: Download all rendered scenes
        uses: actions/download-artifact@v4
        with:
          pattern: scene-*
          path: rendered
          merge-multiple: false
      - name: Restore working layout
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p "content/stories" output/scenes output/audio
          cp staging/story.json "content/stories/${STORY_ID}.json"
          cp staging/audio/*.mp3 output/audio/
          find rendered -type f -name '*.mp4' -exec cp {} output/scenes/ \;
          ls -la output/scenes output/audio
      - name: Composite scenes + narration + music
        run: |
          python scripts/assembly/composite.py \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --audio output/audio --scenes output/scenes --out output/final.mp4
      - name: Generate thumbnail
        run: |
          python scripts/assembly/thumbnail.py \
            --video output/final.mp4 \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --out output/thumbnail.jpg
      - name: Validate final Shorts package
        run: |
          test -s output/final.mp4
          test -s output/thumbnail.jpg
          DIMENSIONS=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final.mp4)
          echo "Video dimensions: $DIMENSIONS"
          test "$DIMENSIONS" = "1080,1920"
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/final.mp4)
          python - <<PY
          d=float("$DURATION")
          assert 40 <= d <= 90, f"Final duration {d:.2f}s is outside Shorts target"
          PY
      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            output/final.mp4
            output/thumbnail.jpg
            content/stories/${{ needs.prepare.outputs.story_id }}.json
          if-no-files-found: error

  upload:
    name: Upload to YouTube
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download final package
        uses: actions/download-artifact@v4
        with:
          name: final
          path: .
      - name: Verify downloaded video
        run: |
          ls -la output/
          test -s output/final.mp4
          SIZE=$(stat -c%s output/final.mp4)
          if [ "$SIZE" -lt 100000 ]; then exit 1; fi
      - name: Upload video to YouTube
        run: |
          python scripts/upload/upload_youtube.py \
            --video output/final.mp4 \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --thumbnail output/thumbnail.jpg
