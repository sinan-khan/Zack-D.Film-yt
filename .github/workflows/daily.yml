name: Daily Short Production

# -------------------------------------------------------------
# Runs twice a day by default (you can edit the cron or add more).
#   * Public repos: free, unlimited runner minutes.
#   * Each run produces one finished short and uploads it to YouTube.
#
# Manual runs:
#   * "Run workflow" button on the Actions tab (workflow_dispatch)
#   * Webhook: POST /repos/{owner}/{repo}/dispatches { event_type: produce }
# -------------------------------------------------------------
on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC
    - cron: "15 19 * * *"  # 19:15 UTC
  workflow_dispatch: {}
  repository_dispatch:
    types: [produce]

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORY_LLM_API_KEY: ${{ secrets.STORY_LLM_API_KEY }}
  STORY_LLM_BASE_URL: ${{ secrets.STORY_LLM_BASE_URL }}
  STORY_LLM_MODEL: ${{ secrets.STORY_LLM_MODEL }}
  TEXT2MOTION_API_KEY: ${{ secrets.TEXT2MOTION_API_KEY }}
  MIXAMO_TOKEN: ${{ secrets.MIXAMO_TOKEN }}
  YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

jobs:
  prepare:
    name: Write story, narrate, fetch animations
    runs-on: ubuntu-latest
    outputs:
      story_id: ${{ steps.plan.outputs.story_id }}
      scene_list: ${{ steps.scenes.outputs.scene_list }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Pick today's story prompt
        id: plan
        run: |
          STORY=$(ls content/prompts/*.txt | head -n1)
          STORY_ID=$(basename "$STORY" .txt)
          echo "story_id=${STORY_ID}" >> "$GITHUB_OUTPUT"
          echo "STORY=${STORY}" >> "$GITHUB_ENV"

      - name: Generate production plan (LLM or offline fallback)
        run: python scripts/content/generate_story.py --prompt "$STORY" --out staging/story.json

      - name: Generate voice-over narration
        run: python scripts/assembly/generate_tts.py --story staging/story.json --out staging/audio

      - name: Fetch Text2Motion animations
        if: env.TEXT2MOTION_API_KEY != ''
        run: |
          python - <<'EOF'
          import json, os, subprocess
          story = json.load(open("staging/story.json"))
          for s in story["scenes"]:
              if s.get("animation_source") == "text2motion":
                  out = f"staging/animations/{story['id']}/scene{s['id']}.fbx"
                  subprocess.run(["python", "scripts/animation/text2motion.py",
                                  "--prompt", s["animation_prompt"], "--out", out], check=True)
          EOF

      - name: Report scene list for the render matrix
        id: scenes
        run: |
          python - <<'EOF'
          import json, os
          story = json.load(open("staging/story.json"))
          ids = [str(s["id"]) for s in story["scenes"]]
          with open(os.environ.get("GITHUB_OUTPUT"), "a") as fh:
              fh.write("scene_list=" + json.dumps(ids) + "\n")
          print("scene_list=" + json.dumps(ids))
          EOF

      - name: Upload story assets for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: story-assets
          path: staging/
          if-no-files-found: error

  render:
    name: Render scene ${{ matrix.scene }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJson(needs.prepare.outputs.scene_list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download story assets
        uses: actions/download-artifact@v4
        with:
          name: story-assets
          path: staging

      - name: Restore plan and animation files
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p content/stories assets/animations
          cp staging/story.json "content/stories/${STORY_ID}.json"
          if [ -d "staging/animations" ]; then cp -r staging/animations/* assets/animations/; fi

      - name: Download character model
        run: |
          mkdir -p assets/characters
          curl -sL -o assets/characters/hero.fbx \
            "https://github.com/sinan33644061-lab/Zack-D.Film-yt/releases/download/hero.fbx/hero.fbx.fbx"

      - name: Render scene with Blender (containerized)
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          docker run --rm -v "$PWD:/work" -w /work \
            blendergrid/blender:latest \
            -b --python-exit-code 1 --python scripts/render/render_scene.py -- \
            --story "content/stories/${STORY_ID}.json" \
            --scene ${{ matrix.scene }} \
            --out "output/scenes/scene${{ matrix.scene }}.mp4" \
            --fps 24

      - name: Upload rendered scene
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: output/scenes/scene${{ matrix.scene }}.mp4
          if-no-files-found: error

  assemble:
    name: Assemble final video + thumbnail
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download story assets
        uses: actions/download-artifact@v4
        with:
          name: story-assets
          path: staging

      - name: Download all rendered scenes
        uses: actions/download-artifact@v4
        with:
          pattern: scene-*

      - name: Restore working layout
        run: |
          STORY_ID="${{ needs.prepare.outputs.story_id }}"
          mkdir -p "content/stories" output/scenes output/audio
          cp staging/story.json "content/stories/${STORY_ID}.json"
          mv staging/audio/*.mp3 output/audio/
          for d in scene-*; do mv "$d"/*.mp4 output/scenes/; done

      - name: Composite scenes + narration + music
        run: |
          python scripts/assembly/composite.py \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --audio output/audio \
            --scenes output/scenes \
            --out output/final.mp4

      - name: Generate thumbnail
        run: |
          python scripts/assembly/thumbnail.py \
            --video output/final.mp4 \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --out output/thumbnail.jpg

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: final
          path: |
            output/final.mp4
            output/thumbnail.jpg
            content/stories/${{ needs.prepare.outputs.story_id }}.json
          if-no-files-found: error

  upload:
    name: Upload to YouTube
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download final package
        uses: actions/download-artifact@v4
        with:
          name: final

      - name: Verify downloaded video size
        run: |
          ls -la output/
          SIZE=$(stat -c%s output/final.mp4 2>/dev/null || echo 0)
          echo "downloaded output/final.mp4 is $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::output/final.mp4 is only $SIZE bytes after artifact download - the assemble job's output did not survive the artifact round-trip"
            exit 1
          fi

      - name: Upload video to YouTube
        run: |
          python scripts/upload/upload_youtube.py \
            --video output/final.mp4 \
            --story "content/stories/${{ needs.prepare.outputs.story_id }}.json" \
            --thumbnail output/thumbnail.jpg
                  - name: Debug - list available Groq models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          curl https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
